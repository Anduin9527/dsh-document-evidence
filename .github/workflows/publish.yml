name: Publish npm beta
on:
  push:
    tags:
      - 'v*-beta.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-beta-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Use a trusted-publishing-capable npm CLI
        run: npm install --global npm@11.18.0
      - name: Verify release tag
        if: github.event_name == 'push'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.match(pkg.version, /^\d+\.\d+\.\d+-beta\.\d+$/)
          assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`)
          assert.equal(pkg.publishConfig.tag, 'beta')
          JS
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements.txt
      - run: npm test
        env:
          PDF_EVIDENCE_TEST_PYTHON: python
      - run: python test/worker_test.py
      - run: npm run check:release
      - name: Check package contents
        run: npm pack --dry-run
      - name: Publish with npm trusted publishing
        if: github.event_name == 'push'
        run: npm publish --access public --tag beta
      - name: Manual validation summary
        if: github.event_name == 'workflow_dispatch'
        run: echo 'Validation passed. Manual runs do not publish; push a new version tag to release.' >> "$GITHUB_STEP_SUMMARY"
